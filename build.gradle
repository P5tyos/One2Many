plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.greg'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ---------- one file for the event: gradlew.bat bootJar -> build/libs/one2many.jar ----------
// Builds the Vue app (npm run build) and packs it into the jar, so the jar alone runs everything.
// Only bootJar does this: tests and the VS Code run button stay as fast as before.
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

tasks.register('buildFrontend', Exec) {
	description = 'Builds the Vue app into frontend/dist'
	workingDir = file('frontend')
	commandLine = isWindows ? ['cmd', '/c', 'npm', 'run', 'build'] : ['npm', 'run', 'build']
}

tasks.named('bootJar') {
	dependsOn 'buildFrontend'
	archiveFileName = 'one2many.jar'
	from('frontend/dist') {
		into 'BOOT-INF/classes/static'
	}
}
