spring.application.name=one2many

# Cookie only sent over HTTPS when true. false for local testing on http://localhost,
# MUST be true at the event (the tunnel provides HTTPS).
one2many.cookie.secure=false

# Admin login for the station (and later the moderator dashboard).
# No password here on purpose: in dev, Spring prints a random one in the console
# at every start. At the event, set the environment variable
# SPRING_SECURITY_USER_PASSWORD instead. Never commit a password to this file.
spring.security.user.name=admin
spring.security.user.roles=ADMIN

# Staff session cookie: same protections as the attendee wristband
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# false for local testing only, true at the event (like one2many.cookie.secure)
server.servlet.session.cookie.secure=false

# Host card, pinned at the top of everyone's list. Leave name or URL empty to disable.
one2many.host.name=Greg Horvath
one2many.host.linkedin-url=https://www.linkedin.com/in/YOUR-PROFILE
one2many.host.message=Organiser of this networking station. Happy to connect!

# On this flag number, the attendee's next edit needs manual approval
one2many.moderation.flags-before-review=3

# Persistent log: only warnings and errors go to the file; archives kept 7 days
logging.file.name=logs/one2many.log
logging.threshold.file=WARN
logging.logback.rollingpolicy.max-history=7