# Event settings: used with --spring.profiles.active=event (start-event.bat does this).
# Everything else comes from application.properties.

# own port: the VS Code app (8080) can never be mistaken for the event app
server.port=8090

# cookies only over HTTPS (the Cloudflare tunnel gives us HTTPS)
one2many.cookie.secure=true
server.servlet.session.cookie.secure=true

# behind the Cloudflare tunnel: believe its "the visitor uses https" header (it connects from
# this same machine), and keep redirects relative, so login never bounces to plain http
server.forward-headers-strategy=native
server.tomcat.use-relative-redirects=true
