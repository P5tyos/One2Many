# Loaded on top of src/main/resources/application.properties by @ActiveProfiles("test").

# Known admin password for tests only (never used outside the test run)
spring.security.user.password=test

# Fixed host card, so tests don't break when the real one in application.properties changes
one2many.host.name=Test Host
one2many.host.linkedin-url=https://www.linkedin.com/in/test-host
one2many.host.message=Host card for tests

# Keep test flags/removals out of the real event log
logging.file.name=build/test-logs/one2many.log
